environments:
  proxy-stop:
    name: Stop and reboot proxies
    templateName: Kasm maintenance PowerShell runner
    requiresApproval: true
  webapp-stop:
    name: Stop and reboot web apps
    templateName: Kasm maintenance PowerShell runner
    requiresApproval: true
    needs: [proxy-stop]
  db-stop:
    name: Stop and reboot databases
    templateName: Kasm maintenance PowerShell runner
    requiresApproval: true
    needs: [webapp-stop]
  db-start:
    name: Start databases
    templateName: Kasm maintenance PowerShell runner
    requiresApproval: true
    needs: [db-stop]
  webapp-start:
    name: Start web apps
    templateName: Kasm maintenance PowerShell runner
    requiresApproval: true
    needs: [db-start]
  proxy-start:
    name: Start proxies
    templateName: Kasm maintenance PowerShell runner
    requiresApproval: true
    needs: [webapp-start]

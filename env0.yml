version: 1

deploy:
  steps:
    terraformPlan:
      before:
        - |-
          case "${KASM_STAGE:-}" in
            proxy-stop|webapp-stop|db-stop|db-start|webapp-start|proxy-start)
              printf '[Kasm] Planning stage %s. Host commands run after approval.\n' "$KASM_STAGE"
              ;;
            *)
              printf '[Kasm] ERROR Set KASM_STAGE to this sub-environment alias.\n' >&2
              exit 1
              ;;
          esac
    terraformApply:
      before:
        - |-
          set -eu
          case "${KASM_STAGE:-}" in
            proxy-stop)   set -- proxy.ps1 -Action stop ;;
            webapp-stop)  set -- webapp.ps1 -Action stop ;;
            db-stop)      set -- db.ps1 -Action stop ;;
            db-start)     set -- db.ps1 -Action start ;;
            webapp-start) set -- webapp.ps1 -Action start ;;
            proxy-start)  set -- proxy.ps1 -Action start ;;
            *)
              printf '[Kasm] ERROR Unknown or missing KASM_STAGE.\n' >&2
              exit 1
              ;;
          esac
          pwsh -NoLogo -NoProfile -NonInteractive -File "$@"
